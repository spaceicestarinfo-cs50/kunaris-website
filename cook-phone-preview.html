<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>私厨手机展示方案 · Kunaris</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f8fbf7;color:#244438;font-family:Arial,"Microsoft YaHei",sans-serif}main{max-width:1080px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.1em;color:#688269}button{font:inherit}.cookSampleSection{margin:44px 0 36px;padding:35px 22px 24px;border-top:1px solid #dce6dd;background:#f1f5f0;border-radius:16px}
.cookSampleSection>h2{font:500 clamp(25px,3vw,35px)/1.3 Georgia,serif;margin:0 0 12px;color:#244438}
.cookSampleIntro{max-width:680px;font-size:15px;line-height:1.7;color:#647b6c;margin:0 0 30px}
.cookPhoneTrack{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
.cookPhoneFigure{margin:0;min-width:0}
.cookPhone{position:relative;width:100%;max-width:300px;margin:auto;height:597px;padding:6px 6px 17px;border:1px solid #8c9890;border-radius:31px;background:#fdfefc;box-shadow:0 8px 18px #2d443513}
.cookPhoneStatus{height:29px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#293c31;font:600 10px/1 Arial,sans-serif}
.cookPhoneStatus i{width:58px;height:14px;border-radius:99px;background:#283a31;position:absolute;left:calc(50% - 29px);top:12px}
.cookPhoneDisplay{height:535px;border-radius:0 0 19px 19px;overflow:auto;background:#fff;color:#273d31;scrollbar-width:none;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}
.cookPhoneDisplay::-webkit-scrollbar{display:none}
.cookPhoneHome{position:absolute;bottom:7px;left:calc(50% - 36px);width:72px;height:3px;border-radius:5px;background:#4b5d50}
.cookAppHeader{display:flex;justify-content:space-between;align-items:center;padding:12px 17px;border-bottom:1px solid #e8ede7;font-size:12px;font-weight:650;line-height:1.3}
.cookAppHeader b{font-size:14px;font-weight:400}
.cookMenuPhoto{height:173px;position:relative;overflow:hidden}
.cookMenuPhoto img{width:100%;height:100%;object-fit:cover;object-position:center 48%;display:block}
.cookMenuPhoto small{position:absolute;bottom:10px;left:12px;background:#fffffff2;padding:5px 8px;color:#4d6252;border-radius:4px;font-size:10px}
.cookAppContent{padding:18px}
.cookAppContent h3{font:600 19px/1.35 Arial,"PingFang SC","Microsoft YaHei",sans-serif;margin:0 0 6px;letter-spacing:0}
.cookPickupNotice{font-size:11px!important;line-height:1.45!important;color:#7b8b7b;margin:0 0 14px}
.cookMenuRows>div{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:15px 0;border-top:1px solid #e7ece5;font-size:12px}
.cookMenuRows b{font-size:12px;font-weight:600}.cookMenuRows small{display:block;margin-top:4px;font-size:10px;color:#8a9889}
.cookQuantity{display:flex;align-items:center;gap:11px;padding:6px 7px;white-space:nowrap;border:1px solid #dfe7dc;border-radius:5px;font-size:11px}
.cookQuantity strong{font-weight:600}
.cookAppButton{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#285b46;color:white;border-radius:6px;padding:12px 13px;margin-top:18px;font-size:12px;line-height:1.35;font-weight:600}
.cookMenuRows .cookItemPrice{color:#41634e;font-size:11px;font-weight:500}
.cookPriceTotal{display:flex;justify-content:space-between;gap:10px;padding-top:11px;margin-top:7px;border-top:1px solid #e2e9de;font-size:11px;color:#526b56}
.cookPriceTotal b{font-size:13px;color:#2c5039;font-weight:600}
.cookPriceNote{display:block;font-size:9px;color:#8d9b87;margin-top:7px}
.cookReceiptTotal{color:#345840}.cookReceiptTotal b{font-weight:600}
.cookStep{display:block;color:#91a18e;font-size:10px;letter-spacing:.07em;margin:0 0 9px}
.cookOrderLine{display:flex;justify-content:space-between;gap:8px;border-block:1px solid #e5ece1;padding:11px 0;margin:15px 0 17px;font-size:11px}
.cookField{margin-bottom:12px}.cookField>b{display:block;font-size:10px;margin-bottom:5px;font-weight:600;color:#5f7364}
.cookField>div{display:flex;justify-content:space-between;gap:7px;align-items:center;min-height:34px;border:1px solid #dfe6dc;border-radius:5px;padding:8px 10px;font-size:11px}
.cookField .cookPlaceholder{color:#99a496}.cookField .cookNoteField{min-height:45px;align-items:flex-start}
.cookAppOrder .cookAppButton{margin-top:16px}
.cookAppSuccess{padding-top:29px;text-align:center}.cookSuccessMark{display:grid;place-items:center;width:45px;height:45px;margin:0 auto 14px;border-radius:50%;background:#edf4e9;color:#31684c;font-size:22px}
.cookPending{display:inline-block;font-size:10px;padding:5px 8px;border:1px solid #e0e8db;color:#73876d;border-radius:4px;margin-top:4px}
.cookAppSuccess>p{font-size:11px!important;line-height:1.7!important;color:#7a8c79;margin:16px 0 18px;text-align:left}
.cookReceipt{text-align:left;border:1px solid #e1e8dc;border-radius:7px;padding:13px;background:#fafcf8}
.cookReceipt>small{font-size:9px;color:#8da085}.cookReceipt h4{font-size:12px;margin:7px 0 11px;font-weight:600}
.cookReceipt>div{display:flex;justify-content:space-between;gap:13px;border-top:1px solid #e5eade;padding:10px 0 2px;font-size:10px;line-height:1.6}
.cookReceipt b{text-align:right;max-width:58%;font-weight:500}
.cookAppSuccess .cookContactHelp{font-size:10px!important;color:#8e9c89;margin-bottom:14px}.cookReturnLink{font-size:11px;color:#3f7155;text-align:left}
.cookPhoneFigure figcaption{display:flex;justify-content:center;align-items:center;gap:9px;margin-top:16px;font-size:13px;color:#5b7562}
.cookPhoneFigure figcaption span{font:12px Georgia,serif;color:#99ad93}
.cookSliderControls{display:none}
.cookSampleNote{font-size:11px;line-height:1.6;color:#8d9d86;margin:25px 0 0}
.zhPage .cookPhoneDisplay :is(h3,h4,p,small,span,b,strong,div){font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif!important;letter-spacing:0}
.zhPage .cookPhoneDisplay :is(h3,h4){font-weight:600!important}
@media(max-width:980px){.cookPhoneTrack{gap:16px}.cookSampleSection{padding-inline:17px}.cookPhone{height:597px}.cookAppContent{padding-inline:14px}}
@media(max-width:800px){.cookPhoneTrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:18px}.cookPhoneTrack::-webkit-scrollbar{display:none}.cookPhoneFigure{flex:0 0 100%;scroll-snap-align:start}.cookPhone{width:min(300px,100%)}.cookSliderControls{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:21px;font-size:12px;color:#6c836d}.cookSliderControls button{display:grid;place-items:center;width:39px;height:39px;border:1px solid #cad9c5;border-radius:50%;background:#fff;color:#2a6544;font-size:19px;cursor:pointer}.cookSliderControls button:disabled{opacity:.35;cursor:default}.cookSampleSection{padding:26px 16px}.cookSampleIntro{font-size:14px}}
